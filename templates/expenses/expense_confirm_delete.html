{% extends 'base.html' %}

{% block title %}Удаление расхода{% endblock %}

{% block content %}
<div class="card">
    <h2>Удалить расход?</h2>
    <p>
        Вы действительно хотите удалить расход
        <strong>«{{ object.title }}»</strong> на сумму <strong>{{ object.amount }}</strong>?
        Это действие нельзя отменить.
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'expense_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
